apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-worker
  namespace: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-worker
  template:
    metadata:
      labels:
        app: event-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: event-worker
          image: ghcr.io/kaaushikk/production-ai-workflow-platform-event-worker:0.1.0
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            readOnlyRootFilesystem: true
---
