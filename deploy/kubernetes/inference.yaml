apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      automountServiceAccountToken: false
      containers:
        - name: inference
          image: ghcr.io/kaaushikk/production-ai-workflow-platform-inference:0.1.0
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: platform-config
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: ai-platform
spec:
  selector:
    app: inference
  ports:
    - name: http
      port: 80
      targetPort: http
