apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
  namespace: ai-platform
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: migration
          image: ghcr.io/kaaushikk/production-ai-workflow-platform-api:0.1.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            readOnlyRootFilesystem: true
