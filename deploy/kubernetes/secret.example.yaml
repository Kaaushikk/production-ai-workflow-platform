apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: ai-platform
type: Opaque
stringData:
  APP_DATABASE_URL: postgresql+psycopg://USER:PASSWORD@MANAGED_POSTGRES:5432/platform
  APP_KAFKA_BOOTSTRAP_SERVERS: MANAGED_KAFKA:9092
  APP_REDIS_URL: rediss://MANAGED_REDIS:6379/0
  APP_OTEL_EXPORTER_ENDPOINT: https://MANAGED_OTLP_ENDPOINT
