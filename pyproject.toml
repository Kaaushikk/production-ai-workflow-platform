[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "production-ai-workflow-platform"
version = "0.1.0"
description = "Multi-tenant AI workflow and ML serving platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "confluent-kafka>=2.6,<3.0",
  "fastapi>=0.115,<1.0",
  "pgvector>=0.3,<1.0",
  "pypdf>=5.1,<6.0",
  "pydantic-settings>=2.6,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]
ml = [
  "numpy>=2.1,<3.0",
  "torch>=2.5,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/platform_api", "src/inference_service", "src/event_worker"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["platform_api", "inference_service", "event_worker"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "torch", "torch.*"]
follow_imports = "skip"

