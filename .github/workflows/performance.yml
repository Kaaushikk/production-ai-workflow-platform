name: Performance

on:
  workflow_dispatch:
    inputs:
      users:
        description: Concurrent users
        required: true
        default: "10"
      duration:
        description: Test duration, such as 60s or 5m
        required: true
        default: "60s"

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[load]"
      - name: Start stack with a load-test rate-limit budget
        env:
          APP_RATE_LIMIT_REQUESTS: "10000"
        run: docker compose up --detach --build --wait --wait-timeout 180
      - name: Seed load-test tenant and document
        env:
          SMOKE_API_KEY: pai_load_test_key_1234567890
        run: |
          docker compose exec -T -e SMOKE_API_KEY="$SMOKE_API_KEY" api python scripts/seed_smoke_tenant.py
          docker compose exec -T -e SMOKE_API_KEY="$SMOKE_API_KEY" api python scripts/smoke_stack.py
      - name: Run Locust workload
        env:
          LOAD_TEST_API_KEY: pai_load_test_key_1234567890
        run: >-
          locust -f load/locustfile.py --headless
          --users "${{ inputs.users }}" --spawn-rate 2
          --run-time "${{ inputs.duration }}" --host http://localhost:8000
          --only-summary --exit-code-on-error 1
      - if: always()
        run: docker compose down --volumes
