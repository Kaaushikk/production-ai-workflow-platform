name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev,ml]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        run: >-
          pytest --cov=platform_api --cov=inference_service
          --cov-report=term-missing --cov-fail-under=85

      - name: Run AI regression evaluation
        run: python -m evaluation.runner --check

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build service images
        run: docker compose build api inference event-worker outbox-dispatcher

      - name: Start and verify the complete stack
        run: docker compose up --detach --no-build --wait --wait-timeout 180

      - name: Show stack diagnostics after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

