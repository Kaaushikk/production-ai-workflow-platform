name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev,ml]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        run: >-
          pytest --cov=platform_api --cov=inference_service
          --cov-report=term-missing --cov-fail-under=85

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build API image
        run: docker build --tag production-ai-workflow-platform:ci .

      - name: Build inference image
        run: docker build --file Dockerfile.inference --tag anomaly-inference:ci .

      - name: Build event worker image
        run: docker build --file Dockerfile.worker --tag platform-event-worker:ci .

